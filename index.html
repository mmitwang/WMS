<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛博工业风WMS仓储管理系统</title>
  <style>
    /* 赛博风加载动画 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0f1c 0%, #12192c 50%, #1a2332 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    
    .cyber-loader {
      width: 80px;
      height: 80px;
      border: 3px solid transparent;
      border-top: 3px solid #00ffff;
      border-right: 3px solid #ff3300;
      border-radius: 50%;
      animation: cyber-spin 1s linear infinite;
      position: relative;
    }
    
    .cyber-loader::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border: 2px solid transparent;
      border-top: 2px solid rgba(0, 255, 255, 0.3);
      border-radius: 50%;
      animation: cyber-spin 2s linear infinite reverse;
    }
    
    @keyframes cyber-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      position: absolute;
      bottom: 30%;
      color: #00ffff;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      text-shadow: 0 0 10px #00ffff;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <div class="cyber-loader"></div>
      <div class="loading-text">系统初始化中...</div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // 页面加载完成后隐藏加载动画
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(() => {
            loading.style.display = 'none';
          }, 500);
        }
      }, 1000);
    });
  </script>
</body>
</html>
